spring.application.name=companion
spring.config.import=optional:file:../.env[.properties]

# allowPublicKeyRetrieval evita o erro "Public Key Retrieval is not allowed" do
# MySQL 8 quando a conexão não usa SSL (como na rede privada do Railway).
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# O Flyway só é usado para os dados de exemplo (perfil "seed"), e não na subida normal.
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Deixa o Tomcat ler o resto de um envio grande demais em vez de derrubar a
# conexão; assim o navegador recebe a resposta "A imagem deve ter até 2 MB".
server.tomcat.max-swallow-size=10MB

companion.jwt.secret=${JWT_SECRET}
companion.jwt.expiration-minutes=60
companion.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Chave da conta de serviço do Firebase (o JSON em Base64). É secreta.
companion.firebase.service-account-base64=${FIREBASE_SERVICE_ACCOUNT_BASE64:}
# Perfil "seed": senha das contas de exemplo criadas no Firebase de desenvolvimento.
companion.firebase.seed-user-password=${SEED_USER_PASSWORD:}

server.forward-headers-strategy=framework
# Plataformas como o Railway informam a porta pela variável PORT; localmente fica 8080.
server.port=${PORT:8080}
