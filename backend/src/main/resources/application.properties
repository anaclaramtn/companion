spring.application.name=companion
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Deixa o Tomcat ler o resto de um envio grande demais em vez de derrubar a
# conexão; assim o navegador recebe a resposta "A imagem deve ter até 2 MB".
server.tomcat.max-swallow-size=10MB

companion.jwt.secret=${JWT_SECRET}
companion.jwt.expiration-minutes=60
companion.frontend-url=${FRONTEND_URL:http://localhost:5173}
companion.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
